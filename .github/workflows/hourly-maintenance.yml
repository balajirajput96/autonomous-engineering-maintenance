name: Hourly Autonomous Engineering Maintenance

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read
  actions: read

env:
  STATE_BRANCH: maintenance-state

concurrency:
  group: autonomous-maintenance
  cancel-in-progress: false

jobs:
  maintenance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Load durable state from the dedicated branch
        run: |
          set -euo pipefail
          git fetch origin "$STATE_BRANCH" || true
          if git show-ref --verify --quiet "refs/remotes/origin/$STATE_BRANCH"; then
            git checkout "origin/$STATE_BRANCH" -- state
          else
            echo "State branch does not exist yet; seed it from the checked-out repository."
            mkdir -p state
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run one maintenance cycle
        env:
          # Prefer the optional cross-repository token; fall back to this repository's token.
          # The fallback keeps public-repository diagnostics runnable, while private-repository
          # access is recorded as an error instead of silently skipping it.
          GH_TOKEN: ${{ secrets.AUTOMATION_GH_TOKEN || github.token }}
        run: python3 scripts/maintenance_cycle.py

      - name: Validate state files
        run: |
          python3 -m json.tool state/latest.json >/dev/null
          python3 scripts/validate_state_contract.py
          python3 - <<'PY'
          import csv
          from pathlib import Path
          path = Path("state/summary.tsv")
          with path.open(newline="") as handle:
              rows = list(csv.DictReader(handle, delimiter="\t"))
          assert rows, "state summary is empty"
          assert int(rows[-1]["cycle"]) <= 2400, "cycle cap exceeded"
          PY
          python3 scripts/test_summary_persistence.py

      - name: Commit durable state to the dedicated branch
        env:
          GH_TOKEN: ${{ secrets.AUTOMATION_GH_TOKEN || github.token }}
        run: |
          set -euo pipefail
          state_dir="$RUNNER_TEMP/maintenance-state"
          git fetch origin "$STATE_BRANCH" || true
          if git show-ref --verify --quiet "refs/remotes/origin/$STATE_BRANCH"; then
            git worktree add --detach "$state_dir" "origin/$STATE_BRANCH"
            git -C "$state_dir" switch -C "$STATE_BRANCH" "origin/$STATE_BRANCH"
          else
            git worktree add --detach "$state_dir" HEAD
            git -C "$state_dir" switch --orphan "$STATE_BRANCH"
            # An orphan worktree has no tracked paths; tolerate the empty-tree rm.
            git -C "$state_dir" rm -rf . 2>/dev/null || true
          fi
          mkdir -p "$state_dir/state"
          cp -R state/. "$state_dir/state/"
          git -C "$state_dir" config user.name "github-actions[bot]"
          git -C "$state_dir" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$state_dir" add state/
          if git -C "$state_dir" diff --cached --quiet; then
            echo "No state changes to commit."
          else
            git -C "$state_dir" commit -m "chore(state): record hourly maintenance cycle"
            git -C "$state_dir" push origin "HEAD:$STATE_BRANCH"
          fi
          git worktree remove --force "$state_dir"
